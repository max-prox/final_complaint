services:
  - type: web
    name: complaint-classifier
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: model-cache
      mountPath: /root/.cache
      sizeGB: 5
